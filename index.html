<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LIVE 3 - Dashboard GMV TikTok Shop</title>
<script>
// PENTING — jaring pengaman error PALING AWAL (sebelum semua script CDN di bawah dimuat):
// Beberapa library CDN (lucide-react, recharts) menjalankan kode top-level mereka SENDIRI
// begitu file-nya selesai diunduh — kalau kebetulan React belum benar-benar siap SAAT ITU
// (misal karena unpkg.com lambat lalu otomatis pindah ke CDN cadangan yang termuat async),
// library itu bisa crash dengan error "can't access property forwardRef/oneOfType of
// undefined". Dashboard ini SUDAH punya sistem cadangan sendiri (ikon SVG inline, dsb) yang
// tetap menyelamatkan tampilan meski ini terjadi — jadi error semacam ini TIDAK merusak
// fungsi apa pun, cuma "berisik" di console. Ditangkap & disenyapkan di sini supaya tidak
// membingungkan, dan supaya browser tidak menganggapnya error fatal yang tidak tertangani.
window.addEventListener('error', function(e) {
  var msg = String((e && e.message) || '');
  if (/forwardRef|oneOfType|is undefined/i.test(msg) && /property/i.test(msg)) {
    console.warn('[LIVE3] Mengabaikan error race-condition CDN yang sudah punya cadangan sendiri:', msg);
    e.preventDefault();
    return true;
  }
}, true);
</script>
<script>
// Jaring pengaman PALING AWAL — jalan lewat setTimeout (independen dari event 'load'),
// jadi tetap jalan meski salah satu script CDN di bawah macet/lambat, supaya splash
// TIDAK PERNAH macet selamanya tanpa keterangan apapun ke pengguna.
(function(){
  setTimeout(function(){
    if (window.React && window.ReactDOM) return; // sudah normal, tidak perlu apa-apa
    var splash = document.getElementById('splash');
    var smsg = document.getElementById('smsg');
    if (smsg) {
      smsg.innerHTML = 'Memuat lebih lama dari biasanya (mungkin koneksi lambat/ada yang diblokir).<br>'
        + '<button onclick="location.reload()" style="margin-top:10px;background:#ef4444;color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;">Muat Ulang</button> '
        + '<button onclick="window.open(location.href,\'_blank\')" style="margin-top:10px;background:#3f3f46;color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;">Buka di Tab Baru</button>';
    }
  }, 8000);
})();
</script>

<!-- PropTypes (dibutuhkan Recharts secara internal — tanpa ini Recharts akan error "can't access property oneOfType/forwardRef") -->
<script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"
  onerror="var s=document.createElement('script');s.crossOrigin='anonymous';s.src='https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js';document.head.appendChild(s)"></script>
<!-- Recharts — sama seperti lucide-react, ini juga membangun komponennya pakai React.forwardRef
     & PropTypes SAAT script-nya sendiri dieksekusi, jadi dimuat manual & BARU dijalankan
     setelah React DAN PropTypes dipastikan siap, supaya tidak crash duluan. -->
<script>
(function loadRechartsWhenReady(triesLeft) {
  if (window.React && window.PropTypes) {
    var s = document.createElement('script');
    s.crossOrigin = 'anonymous';
    s.src = 'https://unpkg.com/recharts@2.12.7/umd/Recharts.js';
    s.onerror = function () {
      var s2 = document.createElement('script');
      s2.crossOrigin = 'anonymous';
      s2.src = 'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js';
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
    return;
  }
  if (triesLeft <= 0) return; // React/PropTypes gagal total dimuat — grafik akan kosong dengan pesan, bukan crash
  setTimeout(function () { loadRechartsWhenReady(triesLeft - 1); }, 100);
})(100);
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   KONFIGURASI SINKRON OTOMATIS (FIREBASE) — isi SEKALI di sini, lalu upload file ini.
   Semua perangkat yang membuka dashboard langsung tersambung real-time, tanpa
   perlu mengisi API key / Database URL apa pun.
   - apiKey      : Firebase Console → Project Settings → Your apps → apiKey
   - databaseURL : Realtime Database → URL (https://xxxx.firebasedatabase.app)
   - room        : kode bebas, semua perangkat memakai kode yang sama
   Kalau dikosongkan, dashboard tetap jalan (data hanya di perangkat ini) dan
   konfigurasi bisa diisi manual lewat menu Sinkron di sidebar.
   ════════════════════════════════════════════════════════════════════════════ */
window.LIVE3_FIREBASE = (window.LIVE3_FIREBASE && window.LIVE3_FIREBASE.apiKey) ? window.LIVE3_FIREBASE : {
  apiKey: '',        // ← tempel apiKey di sini, contoh: 'AIzaSyA....'
  databaseURL: '',   // ← tempel URL database, contoh: 'https://hebe-live3-default-rtdb.asia-southeast1.firebasedatabase.app'
  room: 'default'    // ← kode ruang, SAMA di semua perangkat (pakai kode yang sulit ditebak)
};
/* Alternatif tanpa mengedit file ini (Netlify): Site configuration → Build & deploy →
   Post processing → Snippet injection → "Insert before </head>", isi:
   <script>window.LIVE3_FIREBASE={apiKey:'...',databaseURL:'...',room:'...'};<\/script>
   Konfigurasi dari snippet itu dipakai otomatis (baris di atas tidak menimpanya). */

/* [v6.2] LINK AUTO-SINKRON: link berbentuk https://situs-anda/#live3=<kode> membawa
   konfigurasi Firebase di bagian "#" (tidak pernah terkirim ke server Netlify). Saat dibuka,
   konfigurasi disimpan di perangkat ini, lalu "#..." dihapus dari address bar supaya tidak
   ikut tersalin/tersimpan di riwayat. Setelah itu perangkat tersambung otomatis. */
window.LIVE3_LINK = (function () {
  function b64e(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64d(str) { str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); }
  function encode(cfg) { return b64e(JSON.stringify({ k: cfg.apiKey, u: cfg.databaseURL, r: cfg.room || 'default', v: 1 })); }
  function decode(code) { var o = JSON.parse(b64d(code)); if (!o || !o.k || !o.u) return null; return { apiKey: String(o.k).trim(), databaseURL: String(o.u).trim(), room: String(o.r || 'default').trim() || 'default' }; }
  var applied = null;
  try {
    var m = String(location.hash || '').match(/[#&]live3=([A-Za-z0-9_-]+)/);
    if (m) {
      var cfg = decode(m[1]);
      if (cfg && /^https:\/\//.test(cfg.databaseURL)) {
        localStorage.setItem('live3-fb-config', JSON.stringify(cfg));
        applied = cfg;
      }
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
  } catch (e) { console.warn('[LIVE3] Link auto-sinkron tidak valid:', e); }
  // Terapkan link yang ditempel/diklik saat tab dashboard SUDAH terbuka. Browser tidak memuat ulang
  // halaman kalau yang berubah hanya bagian "#", jadi tanpa ini link tidak berefek apa-apa.
  function applyText(text) {
    var m2 = String(text || '').match(/live3=([A-Za-z0-9_-]+)/);
    if (!m2) return false;
    var c = decode(m2[1]); if (!c || !/^https:\/\//.test(c.databaseURL)) return false;
    localStorage.setItem('live3-fb-config', JSON.stringify(c));
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    location.reload();
    return true;
  }
  window.addEventListener('hashchange', function () { if (/live3=/.test(location.hash)) { try { applyText(location.hash); } catch (e) {} } });
  return { encode: encode, decode: decode, applied: applied, applyText: applyText };
})();

<script>
// Storage shim — [FIX] data utama sekarang disimpan di IndexedDB (kapasitas ratusan MB),
// bukan localStorage (maks ±5MB). Dulu, setelah beberapa screenshot bukti diupload, kuota
// localStorage penuh dan penyimpanan GAGAL diam-diam → data terbaru hilang saat refresh.
// localStorage tetap dibaca sebagai sumber lama (migrasi otomatis) dan cadangan kalau
// IndexedDB tidak tersedia (mis. mode privat browser tertentu).
window.storage = (function () {
  var DB_NAME = 'live3-db', STORE = 'kv', dbp = null;
  function openDb() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      try {
        if (!window.indexedDB) return rej(new Error('no idb'));
        var rq = indexedDB.open(DB_NAME, 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore(STORE); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
        rq.onblocked = function () { rej(new Error('idb blocked')); };
      } catch (e) { rej(e); }
    }).catch(function (e) { dbp = null; throw e; });
    return dbp;
  }
  function idb(mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, mode), st = tx.objectStore(STORE), out;
        var r = fn(st); if (r) r.onsuccess = function () { out = r.result; };

  return {
    get: async function (k) {
      try {
        var v = await idb('readonly', function (st) { return st.get(k); });
        if (v != null) return { key: k, value: v };

      var l = lsGet(k);

    set: async function (k, v) {
      var s = typeof v === 'string' ? v : JSON.stringify(v);

        await idb('readwrite', function (st) { return st.put(s, k); });
        // sudah aman di IndexedDB → hapus salinan lama di localStorage supaya kuotanya lega
        try { localStorage.removeItem(k); localStorage.removeItem('live3_' + k); localStorage.removeItem('ls3_' + k); } catch (e) {}
        return { key: k, value: s };
      } catch (e) {
        try { localStorage.setItem(k, s); return { key: k, value: s }; } catch (e2) { return null; }
      }
    },
    delete: async function (k) { try { await idb('readwrite', function (st) { return st.delete(k); }); } catch (e) {} try { localStorage.removeItem(k); } catch (e) {} return { key: k, deleted: true }; },
    list: async function () { return { keys: [] }; }
  };
})();

// data — dengan ratusan foto, setiap simpan (bahkan cuma ubah 1 angka) menulis ulang ratusan MB

// foto disimpan SEKALI di IndexedDB terpisah (kunci = hash isinya, foto identik otomatis tidak

  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {

      catch (e) { rej(e); }
    }).catch(function (e) { dbp = null; throw e; });

function parseDate(v) {
  // [FIX] SheetJS (cellDates) memberi Date di jam 00:00 waktu LOKAL — dulu dikonversi via
  // toISOString() (UTC) sehingga di WIB semua tanggal dari Excel mundur 1 hari.
  // Sebagian versi SheetJS menghasilkan jam 23:59:4x hari SEBELUMNYA (selisih detik akibat
  // offset zona waktu historis) — kalau jamnya dalam 5 menit dari tengah malam, dibulatkan.
  if (v instanceof Date && !isNaN(v)) {
    const mins = v.getHours() * 60 + v.getMinutes();
    if (mins >= 23 * 60 + 55) return localYmd(new Date(v.getTime() + 10 * 60 * 1000));
    return localYmd(v);
  }
  if (typeof v === 'number' && v > 0) {
    // Excel serial date
    const d = new Date(Math.floor(v - 25569) * 86400000);
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }
  if (typeof v === 'string') {
    const s = v.trim();
    // YYYY-MM-DD
    if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) { const [y, m, d] = s.slice(0, 10).split('-'); return y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0'); }
    // DD/MM/YYYY or D/M/YYYY
    if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)) { const [d, m, y] = s.split('/'); return y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0'); }
    // DD-MM-YYYY
    if (/^\d{1,2}-\d{1,2}-\d{4}/.test(s)) { const [d, m, y] = s.split('-'); return y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0'); }
    // YYYY/MM/DD (mis. "2026/06/15 19:30" dari export TikTok)
    if (/^\d{4}\/\d{1,2}\/\d{1,2}/.test(s)) { const [y, m, d] = s.slice(0, 10).split(/[\/\s]/); return y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0'); }
    // Excel serial yang tersimpan sebagai teks
    if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(Number(s));
    const p = new Date(s);
    if (!isNaN(p)) return localYmd(p);
  }
  return '';
}

function parseNum(v) {

<script>
(function(){
  var splash=document.getElementById('splash'),smsg=document.getElementById('smsg'),errbx=document.getElementById('errbx');
  function showErr(msg){if(errbx){errbx.style.display='block';errbx.innerHTML=msg;}}

  function mount(){
    if(!window.React||!window.ReactDOM){
      smsg.innerHTML='<b>Gagal load React.</b><br><small>Pastikan koneksi internet aktif lalu refresh.</small>';
      showErr('React tidak tersedia.<br><button class="rbtn" onclick="location.reload()">Refresh</button>');
      return;
    }
    if(typeof window.App!=='function'){
      showErr('App tidak ditemukan.<br><button class="rbtn" onclick="location.reload()">Refresh</button>');
      return;
    }

    // CRITICAL: Patch ALL module variables after CDN confirmed loaded
    window._react        = window.React;
    window._recharts     = (function(){
      var obj = window.Recharts||{};
      function N(){return null;}
      if(typeof Proxy==='undefined') return obj;
      return new Proxy(obj,{get:function(t,k){var v=t[k];return v!==undefined?v:(/^[A-Z]/.test(k+'')?N:undefined);}});
    })();
    // _lucidereact already set by inline icons script above
    window._xlsx         = window.XLSX||{};
    window._papaparse    = window.Papa||{};
    window._papaparse2   = {default:window.Papa||{}};

    try {
      var R = window.React;
      function EB(props){R.Component.call(this,props);this.state={hasError:false,error:null};}
      EB.prototype=Object.create(R.Component.prototype);EB.prototype.constructor=EB;
      EB.getDerivedStateFromError=function(e){return{hasError:true,error:e};};
      EB.prototype.componentDidCatch=function(e){console.error('Render error:',e);};
      EB.prototype.render=function(){
        if(this.state.hasError){
          return R.createElement('div',{style:{minHeight:'100vh',background:'#09090b',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'16px',padding:'24px',textAlign:'center',fontFamily:'Inter,system-ui,sans-serif'}},
            R.createElement('div',{style:{fontSize:'48px'}},'⚠️'),
            R.createElement('h2',{style:{color:'#fca5a5',fontSize:'18px',fontWeight:600,margin:0}},'Error Dashboard'),
            R.createElement('p',{style:{color:'#71717a',fontSize:'13px',margin:0}},this.state.error?this.state.error.message:'Unknown error'),
            R.createElement('button',{onClick:function(){location.reload();},style:{background:'#ef4444',color:'white',border:'none',padding:'8px 20px',borderRadius:'8px',cursor:'pointer',marginTop:'8px'}},'Refresh')
          );
        }
        return this.props.children;
      };

      var appEl = R.createElement(EB,null,R.createElement(window.App,null));
      var rootEl = document.getElementById('root');
      if (typeof ReactDOM.createRoot === 'function') {
        ReactDOM.createRoot(rootEl).render(appEl);
      } else if (typeof ReactDOM.render === 'function') {
        // Fallback React 17-style — tetap jalan meski ReactDOM yang termuat bukan build React 18
        ReactDOM.render(appEl, rootEl);
      } else {
        throw new Error('ReactDOM tidak punya createRoot maupun render — versi ReactDOM yang termuat tidak dikenali.');
      }
      splash.style.opacity='0';
      setTimeout(function(){splash.style.display='none';},400);

    } catch(err){
      console.error('Mount error:',err);
      smsg.innerHTML='Error: '+err.message;
      showErr(err.message+'<br><button class="rbtn" onclick="location.reload()">Refresh</button>');
    }
  }

  function waitForReact(tries) {
    // Jangan cuma cek window.ReactDOM ada — pastikan itu React 18 (createRoot) ATAU
    // minimal punya .render (legacy). Kalau window.ReactDOM ternyata objek asing/versi lain
    // yang tidak punya keduanya, tetap tunggu (siapa tahu CDN kita masih proses load).
    var rdReady = window.ReactDOM && (typeof window.ReactDOM.createRoot === 'function' || typeof window.ReactDOM.render === 'function');
    // PENTING: dulu di sini cuma nunggu React/ReactDOM siap, TIDAK menunggu Recharts &
    // PropTypes — padahal Recharts butuh KEDUANYA (React & PropTypes) sudah benar-benar siap
    // SAAT dia sendiri dieksekusi. Kalau salah satu CDN-nya lambat/pakai jalur cadangan
    // (fallback jsdelivr, yang dimuat async lewat JS, urutannya jadi tidak terjamin lagi),
    // Recharts bisa gagal total dengan error "can't access property forwardRef/oneOfType of
    // undefined" — dan diagram jadi kosong tanpa keterangan jelas. Sekarang ditunggu semuanya
    // dulu sebelum aplikasi benar-benar di-mount.
    var rechartsReady = window.Recharts && typeof window.Recharts.PieChart === 'function';
    var propTypesReady = !!window.PropTypes;
    if (window.React && rdReady && rechartsReady && propTypesReady) { mount(); return; }
    if (tries <= 0) { mount(); return; } // Give up (mungkin recharts memang gagal total), biar mount() yang tangani errornya
    setTimeout(function() { waitForReact(tries-1); }, 150);
  }
  if(document.readyState==='complete'){waitForReact(60);}
  else{window.addEventListener('load',function(){waitForReact(60);});}
})();
</script>
